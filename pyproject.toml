[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chertfield"
version = "0.1.0"
description = "Spatial physics-informed neural field for label-free petrophysical inversion of low-resistivity chert pay"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.5.3",
  "pandas==3.0.5",
  "scipy==1.18.1",
  "scikit-learn==1.9.1",
  "matplotlib==3.11.2",
  "lasio==0.32",
  "pyarrow==26.0.1",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
# CPU wheel: pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
model = ["torch==2.15.0"]
data = ["kagglehub==1.0.3", "openpyxl"]
dev = ["pytest==9.2.0", "ruff==0.17.4", "pre-commit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
